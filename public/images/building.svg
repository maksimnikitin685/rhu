<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="380" height="220">
  <!-- Sky -->
  <rect x="0" y="0" width="400" height="170" fill="#cce6ff"/>
  <circle cx="340" cy="40" r="22" fill="#ffe066"/>
  <!-- Clouds -->
  <ellipse cx="90" cy="45" rx="40" ry="15" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="120" cy="40" rx="30" ry="18" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="230" cy="60" rx="45" ry="16" fill="#ffffff" opacity="0.8"/>
  <!-- Ground / Pavement -->
  <rect x="0" y="170" width="400" height="70" fill="#999999"/>
  <rect x="0" y="170" width="400" height="10" fill="#777777"/>
  <!-- University Building -->
  <rect x="50" y="70" width="300" height="100" fill="#f5e6cc" stroke="#555555" stroke-width="2"/>
  <!-- Pediment / Roof -->
  <polygon points="50,70 200,30 350,70" fill="#c0392b" stroke="#555555" stroke-width="2"/>
  <!-- Flag on top -->
  <line x1="200" y1="30" x2="200" y2="10" stroke="#333" stroke-width="2"/>
  <rect x="200" y="10" width="22" height="4" fill="#ffffff"/>
  <rect x="200" y="14" width="22" height="4" fill="#0033aa"/>
  <rect x="200" y="18" width="22" height="4" fill="#cc0000"/>
  <!-- University sign banner -->
  <rect x="110" y="75" width="180" height="18" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="200" y="88" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#003366" text-anchor="middle">РГГМУ • ГЛАВНЫЙ КОРПУС</text>
  <!-- Columns -->
  <rect x="130" y="95" width="12" height="75" fill="#ffffff" stroke="#777" stroke-width="1"/>
  <rect x="160" y="95" width="12" height="75" fill="#ffffff" stroke="#777" stroke-width="1"/>
  <rect x="228" y="95" width="12" height="75" fill="#ffffff" stroke="#777" stroke-width="1"/>
  <rect x="258" y="95" width="12" height="75" fill="#ffffff" stroke="#777" stroke-width="1"/>
  <!-- Entrance door -->
  <rect x="185" y="125" width="30" height="45" fill="#5c3821" stroke="#333" stroke-width="1"/>
  <line x1="200" y1="125" x2="200" y2="170" stroke="#333" stroke-width="1"/>
  <!-- Windows Left Wing -->
  <rect x="65" y="90" width="18" height="25" fill="#66b2ff" stroke="#444"/>
  <rect x="95" y="90" width="18" height="25" fill="#66b2ff" stroke="#444"/>
  <rect x="65" y="125" width="18" height="25" fill="#66b2ff" stroke="#444"/>
  <rect x="95" y="125" width="18" height="25" fill="#66b2ff" stroke="#444"/>
  <!-- Windows Right Wing -->
  <rect x="285" y="90" width="18" height="25" fill="#66b2ff" stroke="#444"/>
  <rect x="315" y="90" width="18" height="25" fill="#66b2ff" stroke="#444"/>
  <rect x="285" y="125" width="18" height="25" fill="#66b2ff" stroke="#444"/>
  <rect x="315" y="125" width="18" height="25" fill="#66b2ff" stroke="#444"/>
  <!-- Trees / Greenery -->
  <ellipse cx="30" cy="150" rx="18" ry="30" fill="#2d862d"/>
  <rect x="28" y="170" width="4" height="15" fill="#553311"/>
  <ellipse cx="370" cy="150" rx="18" ry="30" fill="#2d862d"/>
  <rect x="368" y="170" width="4" height="15" fill="#553311"/>
  <text x="200" y="215" font-family="'Times New Roman', serif" font-size="12" fill="#ffffff" text-anchor="middle">Санкт-Петербург, Малоохтинский пр., 98</text>
</svg>
