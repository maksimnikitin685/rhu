<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="320" height="180">
  <!-- Sky -->
  <rect x="0" y="0" width="350" height="130" fill="#d9ecff"/>
  <circle cx="50" cy="40" r="18" fill="#ffd11a"/>
  <!-- Sea / Waves -->
  <rect x="0" y="130" width="350" height="70" fill="#005580"/>
  <path d="M 0 130 Q 30 125 60 130 T 120 130 T 180 130 T 240 130 T 300 130 T 350 130 L 350 150 L 0 150 Z" fill="#0077b3"/>
  <path d="M 0 145 Q 40 140 80 145 T 160 145 T 240 145 T 320 145 T 350 145 L 350 200 L 0 200 Z" fill="#003d5c"/>
  
  <!-- Ship Hull -->
  <polygon points="60,110 75,145 285,145 305,110" fill="#1f3a52" stroke="#112233" stroke-width="2"/>
  <line x1="70" y1="135" x2="290" y2="135" stroke="#cc0000" stroke-width="3"/>
  <!-- Superstructure -->
  <rect x="110" y="80" width="130" height="30" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="130" y="55" width="75" height="25" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <!-- Windows on bridge -->
  <rect x="136" y="60" width="10" height="10" fill="#3399ff"/>
  <rect x="150" y="60" width="10" height="10" fill="#3399ff"/>
  <rect x="164" y="60" width="10" height="10" fill="#3399ff"/>
  <rect x="178" y="60" width="10" height="10" fill="#3399ff"/>
  <rect x="192" y="60" width="8" height="10" fill="#3399ff"/>
  <!-- Chimney / Funnel -->
  <polygon points="160,35 175,35 172,55 163,55" fill="#cc3300" stroke="#333" stroke-width="1"/>
  <line x1="160" y1="42" x2="174" y2="42" stroke="#ffffff" stroke-width="2"/>
  <!-- Mast & Radar -->
  <line x1="145" y1="20" x2="145" y2="55" stroke="#333" stroke-width="2"/>
  <line x1="138" y1="25" x2="152" y2="25" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="145" cy="20" rx="8" ry="3" fill="#ffffff" stroke="#333"/>
  <!-- Crane for bathometer probes at stern -->
  <line x1="255" y1="110" x2="270" y2="75" stroke="#e67e22" stroke-width="3"/>
  <line x1="270" y1="75" x2="285" y2="90" stroke="#e67e22" stroke-width="2"/>
  <line x1="285" y1="90" x2="285" y2="135" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="282" y="135" width="6" height="12" fill="#c0392b"/>
  <!-- Ship Name -->
  <text x="180" y="125" font-family="'Times New Roman', serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">ПРОФЕССОР ВАЛЕРИАН УРЫВАЕВ</text>
  <text x="175" y="185" font-family="'Times New Roman', serif" font-size="11" fill="#ffffff" text-anchor="middle">Экспедиционное океанологическое судно РГГМУ</text>
</svg>
