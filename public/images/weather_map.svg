<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="320" height="180">
  <rect x="0" y="0" width="350" height="200" fill="#eaf2f8" stroke="#333" stroke-width="1"/>
  <!-- Map Outline (Baltic, Gulf of Finland, Ladoga) -->
  <path d="M 10 90 Q 50 110 80 85 T 140 100 T 170 85" fill="none" stroke="#2980b9" stroke-width="3"/>
  <!-- Gulf of Finland & Ladoga -->
  <path d="M 20 120 Q 90 115 160 110 Q 180 120 170 140 Q 140 135 100 145 Z" fill="#b3d9ff" stroke="#3498db" stroke-width="1.5"/>
  <circle cx="210" cy="95" r="25" fill="#b3d9ff" stroke="#3498db" stroke-width="1.5"/>
  <text x="210" y="98" font-family="'Times New Roman', serif" font-size="8" fill="#003366" text-anchor="middle">Ладожское оз.</text>
  
  <!-- Isobars -->
  <ellipse cx="160" cy="100" rx="90" ry="50" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
  <ellipse cx="160" cy="100" rx="130" ry="75" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Low Pressure Cyclone center -->
  <circle cx="160" cy="100" r="14" fill="#ffcccc" stroke="#cc0000" stroke-width="1.5"/>
  <text x="160" y="105" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#cc0000" text-anchor="middle">Н</text>
  <text x="160" y="122" font-family="'Times New Roman', serif" font-size="9" fill="#990000" text-anchor="middle">998 гПа</text>
  
  <!-- City Points -->
  <circle cx="170" cy="115" r="4" fill="#cc0000"/>
  <text x="180" y="118" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#000000">С.-Петербург (+14°C)</text>
  <text x="180" y="130" font-family="'Times New Roman', serif" font-size="9" fill="#333333">ветер ЮЗ 6 м/с, дождь</text>

  <circle cx="50" cy="60" r="3" fill="#333"/>
  <text x="56" y="63" font-family="'Times New Roman', serif" font-size="9" fill="#333">Выборг (+12°C)</text>

  <circle cx="100" cy="170" r="3" fill="#333"/>
  <text x="106" y="173" font-family="'Times New Roman', serif" font-size="9" fill="#333">Новгород (+15°C)</text>

  <!-- Title bar -->
  <rect x="0" y="0" width="350" height="22" fill="#003366"/>
  <text x="175" y="15" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">КАРТА ПОГОДЫ КАФЕДРЫ МЕТЕОРОЛОГИИ</text>
</svg>
