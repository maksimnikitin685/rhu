<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 220" width="320" height="200">
  <rect x="0" y="0" width="350" height="160" fill="#e6f2ff"/>
  <rect x="0" y="160" width="350" height="60" fill="#7cb342"/>
  
  <!-- Weather Balloon -->
  <circle cx="60" cy="50" r="28" fill="#ff4d4d" stroke="#b30000" stroke-width="2"/>
  <polygon points="56,78 64,78 60,84" fill="#ff4d4d"/>
  <line x1="60" y1="84" x2="60" y2="105" stroke="#666" stroke-width="1"/>
  <rect x="52" y="105" width="16" height="14" fill="#ffffff" stroke="#333"/>
  <text x="60" y="135" font-family="'Times New Roman', serif" font-size="10" fill="#333" text-anchor="middle">Радиозонд</text>

  <!-- Meteorological Shelter (Будка Селянинова) -->
  <line x1="160" y1="110" x2="160" y2="180" stroke="#555" stroke-width="3"/>
  <line x1="190" y1="110" x2="190" y2="180" stroke="#555" stroke-width="3"/>
  <line x1="175" y1="110" x2="175" y2="180" stroke="#555" stroke-width="3"/>
  <rect x="150" y="70" width="50" height="42" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <!-- Louvers -->
  <line x1="154" y1="78" x2="196" y2="78" stroke="#888" stroke-width="2"/>
  <line x1="154" y1="85" x2="196" y2="85" stroke="#888" stroke-width="2"/>
  <line x1="154" y1="92" x2="196" y2="92" stroke="#888" stroke-width="2"/>
  <line x1="154" y1="99" x2="196" y2="99" stroke="#888" stroke-width="2"/>
  <polygon points="146,70 175,55 204,70" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="175" y="198" font-family="'Times New Roman', serif" font-size="10" fill="#ffffff" text-anchor="middle">Психрометрическая будка</text>

  <!-- Anemometer / Wind Vane Mast -->
  <line x1="280" y1="30" x2="280" y2="175" stroke="#222" stroke-width="4"/>
  <!-- Mast rungs -->
  <line x1="272" y1="80" x2="288" y2="80" stroke="#444" stroke-width="2"/>
  <line x1="272" y1="120" x2="288" y2="120" stroke="#444" stroke-width="2"/>
  <!-- Anemometer cups -->
  <circle cx="280" cy="30" r="4" fill="#111"/>
  <line x1="260" y1="30" x2="300" y2="30" stroke="#111" stroke-width="2"/>
  <circle cx="260" cy="30" r="7" fill="#ffcc00" stroke="#111"/>
  <circle cx="300" cy="30" r="7" fill="#ffcc00" stroke="#111"/>
  <!-- Wind vane arrow -->
  <line x1="265" y1="45" x2="295" y2="45" stroke="#cc0000" stroke-width="3"/>
  <polygon points="295,40 305,45 295,50" fill="#cc0000"/>
  <polygon points="265,38 265,52 258,45" fill="#cc0000"/>
  <text x="280" y="198" font-family="'Times New Roman', serif" font-size="10" fill="#ffffff" text-anchor="middle">Анеморумбометр</text>
</svg>
